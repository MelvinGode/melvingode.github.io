<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <link rel="icon" type="image/jpeg" href="{{ '/assets/uncomfortably_close_face.jpeg' | relative_url }}">
  <style>
    body {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 20px 80px;
      font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #333;
    }
    h1 { margin-bottom: 0.2em; }
    h2 { margin-top: 2em; padding-bottom: 0.2em; border-bottom: 1px solid #e5e5e5; }
    a { color: #1a5fb4; text-decoration: none; }
    a:hover { text-decoration: underline; }
    img { max-width: 100%; height: auto; }
    img[align="right"] { margin: 0 0 1em 1.5em; }
    ul { padding-left: 1.2em; }
  </style>
</head>
<body>
  {{ content }}
</body>
</html>
