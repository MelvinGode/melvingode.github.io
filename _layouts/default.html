<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="icon" type="image/jpeg" href="{{ '/assets/uncomfortably_close_face.jpeg' | relative_url }}">
  <style>
    body {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 20px 80px;
      font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #333;
    }
    a { color: #1a5fb4; text-decoration: none; }
    a:hover { text-decoration: underline; }
    img { max-width: 100%; height: auto; }
    ul { padding-left: 1.2em; margin-top: 0.3em; }

    /* Navigation */
    nav {
      display: flex;
      gap: 1.5em;
      padding-bottom: 0.6em;
      margin-bottom: 1.5em;
      border-bottom: 1px solid #e5e5e5;
      font-weight: 600;
    }

    h1 { margin: 0 0 0.2em; }
    h2 { margin-top: 1.8em; padding-bottom: 0.2em; border-bottom: 1px solid #e5e5e5; }
    h3 { margin: 0 0 0.2em; font-size: 1.05em; }

    /* Profile photo, zoomed crop */
    .photo {
      float: right;
      width: 180px;
      height: 220px;
      overflow: hidden;
      margin: 0 0 1em 1.5em;
    }
    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 30%;
      transform: scale(1.3);
      transform-origin: 50% 30%;
    }

    /* Collapsible section */
    details { margin-top: 1.8em; border-bottom: 1px solid #e5e5e5; padding-bottom: 0.8em; }
    summary {
      cursor: pointer;
      font-size: 1.5em;
      font-weight: 700;
      padding-bottom: 0.2em;
    }
    summary:hover { color: #1a5fb4; }
    details > p:first-of-type { color: #666; margin-top: 0.6em; }

    /* Two categories side by side */
    .cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5em 2.5em;
      margin-top: 1.2em;
    }
    @media (max-width: 600px) {
      .cols { grid-template-columns: 1fr; }
      .photo { width: 130px; height: 160px; margin-left: 1em; }
    }

    /* CV page */
    .pdf { width: 100%; height: 85vh; border: 1px solid #ddd; margin-top: 1em; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ '/' | relative_url }}">Home</a>
    <a href="{{ '/cv/' | relative_url }}">CV</a>
    <a href="{{ '/taste/' | relative_url }}">Personal Recommendations</a>
  </nav>
  {{ content }}
</body>
</html>
